# TravelDoc Matching Engine — Tunable Weights & Configuration
# Edit this file to adjust scoring without changing code.
# Restart the API after changing.

weights:
  distance: 0.30
  language: 0.25
  open_now: 0.20
  specialty: 0.15
  verification: 0.05
  rating: 0.05

# Preference-aware ranking profiles for natural-language search.
# Note: Doctor experience_years is not present in the current DB schema, so
# experience_focused emphasizes reliable quality signals (specialty, verification, rating).
profiles:
  balanced:
    distance: 0.25
    language: 0.25
    open_now: 0.15
    specialty: 0.15
    cost: 0.10
    verification: 0.05
    rating: 0.05

  nearest:
    distance: 0.45
    language: 0.20
    open_now: 0.10
    specialty: 0.10
    cost: 0.05
    verification: 0.05
    rating: 0.05

  budget_focused:
    distance: 0.10
    language: 0.20
    open_now: 0.10
    specialty: 0.10
    cost: 0.40
    verification: 0.05
    rating: 0.05

  experience_focused:
    distance: 0.05
    language: 0.20
    open_now: 0.10
    specialty: 0.25
    cost: 0.05
    verification: 0.20
    rating: 0.15

distance:
  max_radius_km: 10

rating:
  default_when_no_reviews: 0.5

# Maps need_category to specialty slugs (ordered by preference)
need_to_specialty:
  fever:
    - general_physician
  stomach_issue:
    - gastroenterology
    - general_physician
  injury:
    - orthopedic
    - emergency_care
  dental_pain:
    - dental
  skin_problem:
    - dermatology
    - general_physician
  ear_nose_throat:
    - ent
    - general_physician
  child_health:
    - pediatrics
    - general_physician
  other:
    - general_physician
    - emergency_care

# Human-readable labels for need categories (used in UI + match_reasons)
need_labels:
  fever: "Fever / Flu"
  stomach_issue: "Stomach Issue"
  injury: "Injury / Wound"
  dental_pain: "Dental Pain"
  skin_problem: "Skin Problem"
  ear_nose_throat: "Ear, Nose & Throat"
  child_health: "Child Health"
  other: "General / Other"
