[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traveldoc-api"
version = "0.1.0"
description = "TravelDoc FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy[asyncio]==2.0.30",
    "greenlet==3.0.3",
    "alembic==1.13.1",
    "geoalchemy2==0.15.1",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "sqladmin==0.16.1",
    "itsdangerous==2.2.0",
    "httpx==0.27.0",
    "python-multipart==0.0.9",
    "slowapi==0.1.9",
    "pytz==2024.1",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.1",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "ruff==0.4.7",
    "black==24.4.2",
    "faker==24.14.1",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
